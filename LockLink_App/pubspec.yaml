name: locklink
description: "Local Wi-Fi door control for LockLink."
publish_to: 'none'

version: 1.5.0+15

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  http: ^1.6.0
  shared_preferences: ^2.5.5
  crypto: ^3.0.7
  flutter_secure_storage: ^11.2.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/locklink.png
  adaptive_icon_background: "#202020"
  adaptive_icon_foreground: assets/icon/locklink_foreground.png
  adaptive_icon_monochrome: assets/icon/locklink_foreground.png
  web:
    generate: true
    image_path: assets/icon/locklink.png
    background_color: "#F6F4EF"
    theme_color: "#F6F4EF"
