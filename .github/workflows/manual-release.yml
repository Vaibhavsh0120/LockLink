name: Manual mobile release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Analyze and test
        working-directory: LockLink_App
        run: |
          flutter pub get
          flutter analyze
          flutter test

  android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Build Android APK
        working-directory: LockLink_App
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../LockLink-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: LockLink-Android.apk
          if-no-files-found: error

  ios:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Build unsigned iOS app
        working-directory: LockLink_App
        run: |
          set -euo pipefail
          flutter pub get
          flutter build ios --release --no-codesign 2>&1 | tee ../ios-build.log
          test -d build/ios/iphoneos/Runner.app
          mkdir -p ../ipa/Payload
          cp -R build/ios/iphoneos/Runner.app ../ipa/Payload/
          cd ../ipa
          zip -qry ../LockLink-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: LockLink-iOS-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-log
          path: ios-build.log
          if-no-files-found: ignore

  publish:
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || exit 1
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: release
      - name: Create or update GitHub release
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/LockLink-Android.apk release/LockLink-iOS-unsigned.ipa --clobber
          else
            gh release create "$RELEASE_TAG" release/LockLink-Android.apk release/LockLink-iOS-unsigned.ipa --target "$GITHUB_SHA" --title "LockLink $RELEASE_TAG" --notes "Local-network LED prototype. Android APK is test-signed. iOS IPA is unsigned and requires signing before device installation."
          fi
