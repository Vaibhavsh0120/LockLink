name: Manual mobile release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching pubspec.yaml, for example v2.0.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  workflows:
    uses: ./.github/workflows/workflow-checks.yml

  verify:
    needs: workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate release version and tag commit
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 .github/scripts/validate_release.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Analyze and test
        working-directory: LockLink_App
        run: |
          flutter pub get
          flutter analyze
          flutter test

  firmware:
    needs: verify
    uses: ./.github/workflows/firmware.yml

  android:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Build Android APK
        working-directory: LockLink_App
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../LockLink-Android.apk
      - name: Test native widget protocol
        working-directory: LockLink_App/android
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: LockLink-Android.apk
          if-no-files-found: error

  ios:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Test native iOS widget storage
        working-directory: LockLink_App
        run: |
          set -euo pipefail
          flutter pub get
          flutter build ios --simulator --debug 2>&1 | tee ../ios-simulator-build.log
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          simulator_id=$(python3 - "$RUNNER_TEMP/simulators.json" <<'PY'
          import json, re, sys
          with open(sys.argv[1], encoding="utf-8") as source:
              devices = json.load(source)["devices"]
          runtimes = sorted(devices, key=lambda runtime: tuple(map(int, re.findall(r"\d+", runtime))), reverse=True)
          phones = [device["udid"] for runtime in runtimes if ".iOS-" in runtime
                    for device in devices[runtime] if device.get("isAvailable") and device["name"].startswith("iPhone")]
          if not phones:
              raise SystemExit("No available iPhone simulator found on the macOS runner.")
          print(phones[0])
          PY
          )
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" -only-testing:RunnerTests \
            -resultBundlePath "$RUNNER_TEMP/ios-widget-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ../ios-widget-tests.log
      - name: Build unsigned iOS app
        working-directory: LockLink_App
        run: |
          set -euo pipefail
          flutter pub get
          flutter build ios --release --no-codesign 2>&1 | tee ../ios-build.log
          test -d build/ios/iphoneos/Runner.app
          test -d build/ios/iphoneos/Runner.app/PlugIns/LockLinkWidgets.appex
          mkdir -p ../ipa/Payload
          cp -R build/ios/iphoneos/Runner.app ../ipa/Payload/
          cd ../ipa
          zip -qry ../LockLink-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned-ipa
          path: LockLink-iOS-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-build-diagnostics
          path: |
            ios-build.log
            ios-simulator-build.log
            ios-widget-tests.log
            ${{ runner.temp }}/ios-widget-tests.xcresult
          if-no-files-found: ignore

  publish:
    needs: [android, ios, firmware]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: ios-unsigned-ipa
          path: release
      - name: Recheck version and remote tag before publication
        run: python3 .github/scripts/validate_release.py
      - name: Create or update GitHub release
        run: |
          set -euo pipefail
          notes="LockLink_Docs/releases/$RELEASE_TAG.md"
          prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease=true
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/LockLink-Android.apk release/LockLink-iOS-unsigned.ipa --clobber
            gh release edit "$RELEASE_TAG" --notes-file "$notes" --prerelease="$prerelease"
          else
            gh release create "$RELEASE_TAG" release/LockLink-Android.apk release/LockLink-iOS-unsigned.ipa --target "$GITHUB_SHA" --title "LockLink $RELEASE_TAG" --notes-file "$notes" --prerelease="$prerelease"
          fi
