name: Firmware checks

on:
  push:
    paths: ['LockLink_IoT/**', 'LockLink_App/pubspec.yaml', '.github/scripts/**', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['LockLink_IoT/**', 'LockLink_App/pubspec.yaml', '.github/scripts/**', '.github/workflows/firmware.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check synchronized version metadata
        run: python .github/scripts/sync_version.py --check
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Test native firmware behavior
        run: python LockLink_IoT/tools/test_native.py
      - name: Require public configuration for published artifacts
        run: test ! -e LockLink_IoT/include/private_config.h
      - name: Build ESP32-C3 app and Matter firmware (unarmed public configuration)
        run: pio run -d LockLink_IoT -e esp32-c3-supermini
      - name: Verify all firmware images
        run: python LockLink_IoT/tools/verify_firmware.py
      - uses: actions/upload-artifact@v7
        with:
          name: locklink-esp32-c3-supermini-firmware
          path: |
            LockLink_IoT/.pio/build/esp32-c3-supermini/firmware.bin
            LockLink_IoT/.pio/build/esp32-c3-supermini/bootloader.bin
            LockLink_IoT/.pio/build/esp32-c3-supermini/partitions.bin
            LockLink_IoT/.pio/build/esp32-c3-supermini/firmware.factory.bin
          if-no-files-found: error
