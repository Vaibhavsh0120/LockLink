name: Firmware checks

on:
  push:
    paths: ['LockLink_IoT/**', 'LockLink_Matter/**', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['LockLink_IoT/**', 'LockLink_Matter/**', '.github/workflows/firmware.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Test actuator behavior
        run: python LockLink_Matter/tools/test_native.py
      - name: Build original firmware
        run: pio run -d LockLink_IoT
      - name: Build Matter firmware (LED mode)
        run: pio run -d LockLink_Matter -e esp32-s3-matter
      - uses: actions/upload-artifact@v7
        with:
          name: locklink-matter-led-firmware
          path: |
            LockLink_Matter/.pio/build/esp32-s3-matter/firmware.bin
            LockLink_Matter/.pio/build/esp32-s3-matter/bootloader.bin
            LockLink_Matter/.pio/build/esp32-s3-matter/partitions.bin
            LockLink_Matter/.pio/build/esp32-s3-matter/firmware.factory.bin
          if-no-files-found: error
