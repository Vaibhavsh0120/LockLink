name: Firmware checks

on:
  push:
    paths: ['LockLink_IoT/**', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['LockLink_IoT/**', '.github/workflows/firmware.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Test native firmware behavior
        run: python LockLink_IoT/tools/test_native.py
      - name: Build unified app and Matter firmware (LED mode)
        run: pio run -d LockLink_IoT -e esp32-s3-n16r8
      - name: Verify all firmware images
        run: |
          set -euo pipefail
          for image in firmware.bin bootloader.bin partitions.bin firmware.factory.bin; do
            test -s "LockLink_IoT/.pio/build/esp32-s3-n16r8/$image" || {
              echo "::error::Missing or empty firmware image: $image"
              exit 1
            }
          done
      - uses: actions/upload-artifact@v7
        with:
          name: locklink-iot-led-firmware
          path: |
            LockLink_IoT/.pio/build/esp32-s3-n16r8/firmware.bin
            LockLink_IoT/.pio/build/esp32-s3-n16r8/bootloader.bin
            LockLink_IoT/.pio/build/esp32-s3-n16r8/partitions.bin
            LockLink_IoT/.pio/build/esp32-s3-n16r8/firmware.factory.bin
          if-no-files-found: error
